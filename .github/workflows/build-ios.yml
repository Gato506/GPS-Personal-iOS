
name: Compilar GPS Personal iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar Xcode
        run: xcodebuild -version

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA sin firmar
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/Locus.app" Payload/
          zip -qr GPS-Personal-iOS.ipa Payload

      - name: Guardar archivo
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Personal-iOS
          path: GPS-Personal-iOS.ipa
